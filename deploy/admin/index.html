<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>coret admin</title>
<style>
  :root { --bg:#0f1115; --card:#161a22; --line:#232a36; --tx:#dfe6f1; --dim:#8a94a6; --acc:#147a6b; --warn:#f08c00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 ui-monospace,Consolas,monospace; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; } h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  nav { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  nav button { background:var(--card); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 14px; font:inherit; cursor:pointer; }
  nav button.on { color:var(--tx); border-color:var(--acc); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:22px; margin-top:2px; }
  .stat span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:22px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; background:#11141b; }
  tr:last-child td { border-bottom:none; }
  .chip { display:inline-block; background:#1d232e; border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin:1px 2px 1px 0; font-size:12px; }
  .chip.owner { border-color:var(--acc); color:#7fd6c4; } .chip.editor { border-color:#2b6cb0; color:#9dc3f5; } .chip.viewer { color:var(--dim); }
  .dim { color:var(--dim); } .fresh { color:#7fd6c4; }
  #err { display:none; background:#2a1518; border:1px solid #5c2b31; color:#ff9aa4; padding:10px 14px; border-radius:10px; margin-bottom:16px; }
  a { color:#9dc3f5; text-decoration:none; } a:hover { text-decoration:underline; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:16px; }
  .cardx { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .cardx canvas, .cardx img { width:100%; height:130px; object-fit:contain; border-radius:6px; background:#0b0d11; display:block; }
  .cardx .meta { font-size:11.5px; color:var(--dim); margin-top:6px; word-break:break-all; }
  .cardx .meta b { color:var(--tx); font-weight:normal; }
  button.more { background:var(--card); color:var(--dim); border:1px dashed var(--line); border-radius:10px; padding:10px; width:100%; cursor:pointer; font:inherit; }
  button.more:hover { color:var(--tx); }
  section { display:none; } section.on { display:block; }
</style>
</head>
<body>
  <h1>coret<span>.app</span> admin</h1>
  <div class="sub">production instance · auto-refresh 10s (live tab) · <span id="when">-</span></div>
  <div id="err"></div>
  <nav>
    <button data-tab="live" class="on">live</button>
    <button data-tab="rooms">rooms</button>
    <button data-tab="docs">docs</button>
    <button data-tab="images">images</button>
  </nav>

  <section id="live" class="on">
    <div class="stats" id="stats"></div>
    <table id="rooms-live"><thead><tr><th>live rooms</th><th>editors</th><th>participants</th><th>elements</th><th>last activity</th></tr></thead><tbody></tbody></table>
    <table id="recent"><thead><tr><th>recent drawings</th><th>who</th><th>where</th><th>when</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="rooms">
    <table id="rooms-db"><thead><tr><th>room</th><th>docs</th><th>password</th><th>last update</th><th>created</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="docs">
    <div class="grid" id="docs-grid"></div>
    <button class="more" id="docs-more">load more</button>
  </section>

  <section id="images">
    <div class="grid" id="images-grid"></div>
    <button class="more" id="images-more">load more</button>
  </section>

<script>
const $ = (id) => document.getElementById(id);
const ago = (s) => s < 60 ? s + 's' : s < 3600 ? Math.round(s/60) + 'm' : s < 86400 ? Math.round(s/3600) + 'h' : Math.round(s/86400) + 'd';
const agoFrom = (unix) => ago(Math.max(0, Math.round(Date.now()/1000 - unix)));
const esc = (t) => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
const api = (path) => fetch('/admin/api/' + path, { cache: 'no-store' }).then((r) => { if (r.status === 401) throw new Error('401 — wrong credentials'); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });

// ---------- mini renderer: draws a document's elements into a canvas
async function drawDoc(canvas, els) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width = 440, H = canvas.height = 260;
  ctx.fillStyle = '#0b0d11'; ctx.fillRect(0, 0, W, H);
  const live = els.filter((e) => !e.del);
  if (!live.length) { ctx.fillStyle = '#333'; ctx.font = '13px monospace'; ctx.fillText('(empty)', 10, 20); return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const box = (e) => { x0 = Math.min(x0, e.x); y0 = Math.min(y0, e.y); x1 = Math.max(x1, e.x + (e.w || 0)); y1 = Math.max(y1, e.y + (e.h || 0)); };
  live.forEach((e) => { box(e); if (e.pts) for (let i = 0; i + 1 < e.pts.length; i += 2) { x0 = Math.min(x0, e.pts[i]); x1 = Math.max(x1, e.pts[i]); y0 = Math.min(y0, e.pts[i+1]); y1 = Math.max(y1, e.pts[i+1]); } });
  const pad = 14, k = Math.min((W - pad*2) / Math.max(1, x1 - x0), (H - pad*2) / Math.max(1, y1 - y0));
  const tx = (x) => (x - x0) * k + (W - (x1 - x0) * k) / 2, ty = (y) => (y - y0) * k + (H - (y1 - y0) * k) / 2;
  const imgs = {};
  await Promise.all(live.filter((e) => e.k === 'image' && e.img).slice(0, 8).map((e) =>
    new Promise((res) => { const im = new Image(); im.onload = () => { imgs[e.img] = im; res(); }; im.onerror = res; im.src = '/admin/api/img/' + e.img; })));
  for (const e of live) {
    ctx.strokeStyle = e.st || '#7fd6c4'; ctx.lineWidth = Math.max(0.8, (e.sw || 1) * k);
    ctx.fillStyle = (e.fl && e.fl !== 'none') ? e.fl : 'transparent';
    const x = tx(e.x), y = ty(e.y), w = (e.w || 0) * k, h = (e.h || 0) * k;
    if (e.k === 'rect') { ctx.beginPath(); ctx.rect(x, y, w, h); if (e.fl && e.fl !== 'none') ctx.fill(); ctx.stroke(); }
    else if (e.k === 'ellipse') { ctx.beginPath(); ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, 7); if (e.fl && e.fl !== 'none') ctx.fill(); ctx.stroke(); }
    else if (e.k === 'diamond') { ctx.beginPath(); ctx.moveTo(x + w/2, y); ctx.lineTo(x + w, y + h/2); ctx.lineTo(x + w/2, y + h); ctx.lineTo(x, y + h/2); ctx.closePath(); if (e.fl && e.fl !== 'none') ctx.fill(); ctx.stroke(); }
    else if (e.k === 'arrow' || e.k === 'pencil') { ctx.beginPath(); if (e.pts) { ctx.moveTo(tx(e.pts[0]), ty(e.pts[1])); for (let i = 2; i + 1 < e.pts.length; i += 2) ctx.lineTo(tx(e.pts[i]), ty(e.pts[i+1])); } ctx.stroke(); }
    else if (e.k === 'text') { ctx.fillStyle = '#dfe6f1'; ctx.font = Math.max(8, (e.fs || 16) * k) + 'px monospace'; (e.tx || '').split('\n').slice(0, 4).forEach((line, i) => ctx.fillText(line.slice(0, 40), x, y + (i + 0.8) * Math.max(10, (e.fs || 16) * k * 1.2))); }
    else if (e.k === 'image' && imgs[e.img]) ctx.drawImage(imgs[e.img], x, y, Math.max(8, w), Math.max(8, h));
    else if (e.k === 'html') { ctx.fillStyle = '#1d232e'; ctx.fillRect(x, y, Math.max(8, w), Math.max(8, h)); ctx.strokeStyle = '#2b6cb0'; ctx.strokeRect(x, y, Math.max(8, w), Math.max(8, h)); }
    if (e.tx && e.k !== 'text' && (e.w || 0) > 0) { ctx.fillStyle = '#8a94a6'; ctx.font = '10px monospace'; ctx.fillText(e.tx.split('\n')[0].slice(0, 22), x + 2, y + 10); }
  }
}

// ---------- tabs
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.remove('on'));
  document.querySelectorAll('section').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); $(b.dataset.tab).classList.add('on');
  if (b.dataset.tab === 'rooms') loadRooms();
  if (b.dataset.tab === 'docs') { $('docs-grid').innerHTML = ''; docsOffset = 0; loadDocs(); }
  if (b.dataset.tab === 'images') { $('images-grid').innerHTML = ''; imgOffset = 0; loadImages(); }
});

async function loadRooms() {
  try {
    const v = await api('rooms');
    const tb = $('rooms-db').querySelector('tbody'); tb.innerHTML = '';
    if (!v.rooms.length) tb.innerHTML = '<tr><td colspan="5" class="dim">no rooms yet</td></tr>';
    for (const r of v.rooms)
      tb.insertAdjacentHTML('beforeend', '<tr><td><a href="https://coret.app/' + esc(r.room) + '" target="_blank" rel="noopener">' + esc(r.room) + '</a></td><td>' + r.docs + '</td><td>' + (r.pw ? '🔒 yes' : '<span class="dim">open</span>') + '</td><td>' + agoFrom(r.last) + ' ago</td><td class="dim">' + new Date(r.created * 1000).toISOString().slice(0, 10) + '</td></tr>');
  } catch (e) { showErr(e.message); }
}

let docsOffset = 0;
async function loadDocs() {
  try {
    const v = await api('docs?limit=24&offset=' + docsOffset);
    const g = $('docs-grid');
    v.docs.forEach((d) => {
      const c = document.createElement('div'); c.className = 'cardx';
      c.innerHTML = '<canvas></canvas><div class="meta"><a href="https://coret.app/' + esc(d.room) + '/' + esc(d.nano) + '" target="_blank" rel="noopener"><b>' + (esc(d.title) || 'untitled') + '</b></a><br>' + esc(d.room) + ' · ' + d.elements + ' el · ' + agoFrom(d.updated) + ' ago</div>';
      g.appendChild(c);
      fetch('/admin/api/doc/' + encodeURIComponent(d.room) + '/' + d.nano).then((r) => r.json()).then((doc) => drawDoc(c.querySelector('canvas'), doc.els || [])).catch(() => drawDoc(c.querySelector('canvas'), []));
    });
    docsOffset += v.docs.length;
    $('docs-more').style.display = docsOffset >= v.total ? 'none' : 'block';
    $('docs-more').textContent = v.total + ' docs in db — load more (' + docsOffset + ' loaded)';
  } catch (e) { showErr(e.message); }
}
$('docs-more').onclick = loadDocs;

let imgOffset = 0;
async function loadImages() {
  try {
    const v = await api('images?limit=24&offset=' + imgOffset);
    const g = $('images-grid');
    v.images.forEach((i) => {
      const c = document.createElement('div'); c.className = 'cardx';
      c.innerHTML = '<img loading="lazy" src="/admin/api/img/' + i.sha + '" alt=""><div class="meta"><b>' + i.sha.slice(0, 10) + '</b> · ' + (i.size/1024).toFixed(0) + ' KB · ' + i.mime.replace('image/', '') + ' · used by ' + i.used_by + ' doc(s)<br>' + agoFrom(i.created) + ' ago</div>';
      g.appendChild(c);
    });
    imgOffset += v.images.length;
    $('images-more').style.display = imgOffset >= v.total ? 'none' : 'block';
    $('images-more').textContent = v.total + ' images in db — load more (' + imgOffset + ' loaded)';
  } catch (e) { showErr(e.message); }
}
$('images-more').onclick = loadImages;

// ---------- live tab (unchanged logic)
async function tick() {
  try {
    const v = await api('overview');
    $('err').style.display = 'none';
    $('when').textContent = 'updated ' + new Date().toLocaleTimeString();
    const L = v.live, D = v.db;
    $('stats').innerHTML = [
      ['connections', L.connections], ['editors', L.editors], ['viewers', L.viewers], ['open docs', L.docs],
      ['rooms in db', D.rooms], ['docs in db', D.docs], ['images', D.images], ['build', esc(v.build)],
    ].map(([k, val]) => '<div class="stat"><span>' + k + '</span><b>' + val + '</b></div>').join('');
    const rb = $('rooms-live').querySelector('tbody'); rb.innerHTML = '';
    if (!v.docs.length) rb.innerHTML = '<tr><td colspan="5" class="dim">nobody is drawing right now</td></tr>';
    for (const d of v.docs) {
      const people = d.participants.map((p) => '<span class="chip ' + p.role + '">' + esc(p.name) + '</span>').join('');
      const act = d.last_op_secs < 120 ? '<span class="fresh">' + ago(d.last_op_secs) + '</span>' : ago(d.last_op_secs);
      rb.insertAdjacentHTML('beforeend', '<tr><td><a href="https://coret.app/' + esc(d.room) + '/' + esc(d.nano) + '" target="_blank" rel="noopener">' + esc(d.room) + '/' + esc(d.nano) + '</a><br><span class="dim">' + esc(d.title) + '</span></td><td>' + d.editors + ' <span class="dim">+' + d.viewers + 'v</span></td><td>' + people + '</td><td>' + d.elements + '</td><td>' + act + '</td></tr>');
    }
    const tb = $('recent').querySelector('tbody'); tb.innerHTML = '';
    if (!v.recent.length) tb.innerHTML = '<tr><td colspan="4" class="dim">no drawing activity yet</td></tr>';
    for (const e of v.recent.slice(0, 40))
      tb.insertAdjacentHTML('beforeend', '<tr><td>' + esc(e.what) + '</td><td>' + esc(e.who) + '</td><td class="dim">' + esc(e.room) + '</td><td class="dim">' + ago(e.ago_secs) + '</td></tr>');
  } catch (e) { showErr(e.message); }
}
function showErr(m) { $('err').style.display = 'block'; $('err').textContent = m; }
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
