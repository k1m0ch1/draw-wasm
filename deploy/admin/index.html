<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>coret admin</title>
<style>
  :root { --bg:#0f1115; --card:#161a22; --line:#232a36; --tx:#dfe6f1; --dim:#8a94a6; --acc:#147a6b; --warn:#f08c00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 ui-monospace,Consolas,monospace; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; } h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:22px; margin-top:2px; }
  .stat span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:22px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; background:#11141b; }
  tr:last-child td { border-bottom:none; }
  .chip { display:inline-block; background:#1d232e; border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin:1px 2px 1px 0; font-size:12px; }
  .chip.owner { border-color:var(--acc); color:#7fd6c4; } .chip.editor { border-color:#2b6cb0; color:#9dc3f5; } .chip.viewer { color:var(--dim); }
  .dim { color:var(--dim); } .warn { color:var(--warn); } .fresh { color:#7fd6c4; }
  #err { display:none; background:#2a1518; border:1px solid #5c2b31; color:#ff9aa4; padding:10px 14px; border-radius:10px; margin-bottom:16px; }
  a { color:#9dc3f5; text-decoration:none; } a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <h1>coret<span>.app</span> admin</h1>
  <div class="sub">live view of the production instance · auto-refresh 5s · <span id="when">-</span></div>
  <div id="err"></div>
  <div class="stats" id="stats"></div>
  <table id="rooms"><thead><tr><th>live rooms</th><th>editors</th><th>participants</th><th>elements</th><th>last activity</th></tr></thead><tbody></tbody></table>
  <table id="recent"><thead><tr><th>recent drawings</th><th>who</th><th>where</th><th>when</th></tr></thead><tbody></tbody></table>

<script>
const ago = (s) => s < 60 ? s + 's ago' : s < 3600 ? Math.round(s/60) + 'm ago' : Math.round(s/3600) + 'h ago';
const esc = (t) => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
function row(t) { const r = document.getElementById('rooms').querySelector('tbody'); r.insertAdjacentHTML('beforeend', t); }
async function tick() {
  try {
    const r = await fetch('/admin/api/overview', { cache: 'no-store' });
    if (r.status === 401) { document.getElementById('err').style.display = 'block'; document.getElementById('err').textContent = '401 — wrong credentials'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const v = await r.json();
    document.getElementById('err').style.display = 'none';
    document.getElementById('when').textContent = 'updated ' + new Date().toLocaleTimeString();
    const L = v.live, D = v.db;
    document.getElementById('stats').innerHTML = [
      ['connections', L.connections], ['editors', L.editors], ['viewers', L.viewers], ['open docs', L.docs],
      ['rooms in db', D.rooms], ['docs in db', D.docs], ['images', D.images], ['build', esc(v.build)],
    ].map(([k, val]) => '<div class="stat"><span>' + k + '</span><b>' + val + '</b></div>').join('');
    const rb = document.getElementById('rooms').querySelector('tbody'); rb.innerHTML = '';
    if (!v.docs.length) rb.insertAdjacentHTML('beforeend', '<tr><td colspan="5" class="dim">nobody is drawing right now</td></tr>');
    for (const d of v.docs) {
      const people = d.participants.map((p) => '<span class="chip ' + p.role + '">' + esc(p.name) + '</span>').join('');
      const act = d.last_op_secs < 120 ? '<span class="fresh">' + ago(d.last_op_secs) + '</span>' : ago(d.last_op_secs);
      row('<tr><td><a href="https://coret.app/' + esc(d.room) + '/' + esc(d.nano) + '" target="_blank" rel="noopener">' + esc(d.room) + '/' + esc(d.nano) + '</a><br><span class="dim">' + esc(d.title) + '</span></td><td>' + d.editors + ' <span class="dim">+' + d.viewers + 'v</span></td><td>' + people + '</td><td>' + d.elements + '</td><td>' + act + '</td></tr>');
    }
    const tb = document.getElementById('recent').querySelector('tbody'); tb.innerHTML = '';
    if (!v.recent.length) tb.insertAdjacentHTML('beforeend', '<tr><td colspan="4" class="dim">no drawing activity yet</td></tr>');
    for (const e of v.recent.slice(0, 40)) {
      tb.insertAdjacentHTML('beforeend', '<tr><td>' + esc(e.what) + '</td><td>' + esc(e.who) + '</td><td class="dim">' + esc(e.room) + '</td><td class="dim">' + ago(e.ago_secs) + '</td></tr>');
    }
  } catch (e) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = 'fetch failed: ' + e.message;
  }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
