# Second instance: production (coret.app). Fresh DB, own volume. See cf/README.md.
name: coret
services:
  draw-coret:
    container_name: draw-coret
    image: draw-app:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    environment:
      PUBLIC_BASE_URL: https://coret.app
    ports:
      - "127.0.0.1:8191:8080"
    volumes:
      - draw_coret_data:/data
    healthcheck:
      test: ["CMD", "/app/draw-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  draw_coret_data:
    name: draw_coret_data
